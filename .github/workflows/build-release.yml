name: Build and release app

on:
  workflow_dispatch:
    inputs:
      republish_manifest_tag:
        description: Existing release tag (e.g. v1.2.1) whose update manifest and website metadata should be republished, without rebuilding
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build, sign and release APK
    if: (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && inputs.republish_manifest_tag == ''
    concurrency:
      group: site-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android

      - name: Configure release signing
        env:
          SIGNING_KEY_B64: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing one or more ANDROID_RELEASE_* secrets."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > tubik-release.jks
          cat <<EOF > keystore.properties
          storeFile=${GITHUB_WORKSPACE}/tubik-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Run unit tests and build signed release APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Clean up signing files
        if: always()
        run: rm -f tubik-release.jks keystore.properties

      - name: Verify APK signature and 16 KB alignment
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          "${BUILD_TOOLS_DIR}/zipalign" -c -P 16 -v 4 "$APK_PATH"
          "${BUILD_TOOLS_DIR}/apksigner" verify --print-certs --verbose "$APK_PATH"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            OUT_NAME="tubik-${GITHUB_REF_NAME}.apk"
          else
            OUT_NAME="tubik-release.apk"
          fi
          mv "$APK_PATH" "$OUT_NAME"
          echo "APK_FILE=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Create changelog summary
        id: changelog-summary
        run: |
          summary_file=$(find fastlane/metadata/android/en-US/changelogs/ -maxdepth 1 -name '*.txt' | sort -V | tail -n 1)
          if [ -n "$summary_file" ] && [ -f "$summary_file" ]; then
            summary_quoted=$(sed 's/^/> /' "$summary_file")
            {
              echo "summary<<EOF"
              echo "> [!NOTE]"
              echo "> ## Release Highlights"
              echo "$summary_quoted"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "summary=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tubik-release-apk
          path: ${{ env.APK_FILE }}

      - name: Attest APK build provenance
        if: github.ref_type == 'tag' && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.APK_FILE }}

      - name: Upload APK to Cloudflare R2
        if: github.ref_type == 'tag'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          aws s3 cp "${APK_FILE}" "s3://tubik-releases/${APK_FILE}" \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Tubik ${{ github.ref_name }}
          body: ${{ steps.changelog-summary.outputs.summary }}
          generate_release_notes: true
          files: ${{ env.APK_FILE }}
          fail_on_unmatched_files: true
          make_latest: true

      - name: Update website manifest and download metadata
        if: github.ref_type == 'tag'
        run: |
          python3 tools/release/update_website_manifest.py \
            --tag "${GITHUB_REF_NAME}" \
            --apk "${APK_FILE}"

      - name: Deploy website and update manifest to Cloudflare Pages
        if: github.ref_type == 'tag'
        uses: ./.github/actions/deploy-pages
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-website:
    name: Deploy website to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: site-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The live manifest is the source of truth for the published release. If it cannot be
      # fetched or validated the deploy stops; the checked-in manifest is never substituted.
      - name: Fetch live update manifest
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            "https://tubik.23p.dev/updates/latest.json" \
            -o "${RUNNER_TEMP}/live-latest.json"

      - name: Render website from the live release
        run: |
          python3 tools/release/update_website_manifest.py \
            --live-manifest "${RUNNER_TEMP}/live-latest.json"

      - name: Deploy website to Cloudflare Pages
        uses: ./.github/actions/deploy-pages
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  republish-manifest:
    name: Republish update manifest for an existing release
    if: github.event_name == 'workflow_dispatch' && inputs.republish_manifest_tag != ''
    concurrency:
      group: site-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The website comes from the revision that ran this workflow; only the APK and its release
      # metadata (version, changelog, publish date) come from the selected tag.
      - uses: actions/checkout@v7

      - name: Extract release metadata from the selected tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.republish_manifest_tag }}
        run: |
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          meta_dir="${RUNNER_TEMP}/release-meta"
          mkdir -p "$meta_dir"
          git archive "refs/tags/${TAG}" app/build.gradle.kts fastlane/metadata/android/en-US/changelogs \
            | tar -x -C "$meta_dir"
          published_at=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)
          echo "RELEASE_META_DIR=$meta_dir" >> "$GITHUB_ENV"
          echo "RELEASE_PUBLISHED_AT=$published_at" >> "$GITHUB_ENV"

      - name: Download released APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.republish_manifest_tag }}
        run: gh release download "$TAG" --pattern "tubik-${TAG}.apk" --dir "${RUNNER_TEMP}/apk"

      - name: Regenerate manifest and download metadata
        env:
          TAG: ${{ inputs.republish_manifest_tag }}
        run: |
          python3 tools/release/update_website_manifest.py \
            --tag "$TAG" \
            --apk "${RUNNER_TEMP}/apk/tubik-${TAG}.apk" \
            --gradle "${RELEASE_META_DIR}/app/build.gradle.kts" \
            --changelog-dir "${RELEASE_META_DIR}/fastlane/metadata/android/en-US/changelogs" \
            --published-at "$RELEASE_PUBLISHED_AT"

      - name: Deploy website and manifest to Cloudflare Pages
        uses: ./.github/actions/deploy-pages
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    <rect x="26" y="186" width="308" height="162" rx="14" fill="#3D0B08" fill-opacity="0.12"/>
    <circle cx="180" cy="260" r="24" fill="#FFFDF8" fill-opacity="0.92"/>
    <polygon points="174,250 192,260 174,270" fill="#B92237"/>
    <rect x="282" y="320" width="42" height="18" rx="4" fill="#2A1412" fill-opacity="0.88"/>
    <text x="303" y="333" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF">6:42</text>

    <circle cx="42" cy="370" r="14" fill="#F7C659" stroke="#61100C" stroke-width="1.2"/>
    <text x="42" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#61100C">SK</text>
    <text x="64" y="366" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#3D0B08">How Do Volcanoes Make Islands?</text>
    <text x="64" y="383" font-family="system-ui, sans-serif" font-size="11.5" fill="#6B3632">SciShow Kids · 2 days ago</text>

    <!-- Video card 2 -->
    <rect x="26" y="402" width="308" height="162" rx="14" fill="#DC2C4A"/>
    <rect x="26" y="402" width="308" height="162" rx="14" fill="#2A1412" fill-opacity="0.16"/>
    <circle cx="180" cy="476" r="24" fill="#FFFDF8" fill-opacity="0.92"/>
    <polygon points="174,466 192,476 174,486" fill="#B92237"/>
    <rect x="282" y="536" width="42" height="18" rx="4" fill="#2A1412" fill-opacity="0.88"/>
    <text x="303" y="549" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF">9:18</text>

    <circle cx="42" cy="586" r="14" fill="#FEE0AE" stroke="#61100C" stroke-width="1.2"/>
    <text x="42" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#61100C">AH</text>
    <text x="64" y="582" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#3D0B08">Draw a Friendly Stegosaurus</text>
    <text x="64" y="599" font-family="system-ui, sans-serif" font-size="11.5" fill="#6B3632">Art for Kids Hub · 5 days ago</text>

    <!-- Bottom bar: Search, Subscriptions, Library (NO Trending) -->
    <rect x="14" y="624" width="332" height="82" fill="#F6EAD6"/>
    <line x1="14" y1="624" x2="346" y2="624" stroke="#E5D3B5" stroke-width="1"/>
    <!-- Search tab -->
    <circle cx="72" cy="650" r="6" fill="none" stroke="#6B3632" stroke-width="1.8"/>
    <line x1="76.5" y1="654.5" x2="80" y2="658" stroke="#6B3632" stroke-width="1.8" stroke-linecap="round"/>
    <text x="72" y="676" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B3632">Search</text>
    <!-- Subscriptions active tab -->
    <rect x="150" y="638" width="60" height="26" rx="13" fill="#B92237" fill-opacity="0.16"/>
    <rect x="172" y="645" width="16" height="12" rx="2" fill="none" stroke="#B92237" stroke-width="1.8"/>
    <polygon points="178,648.5 183,651 178,653.5" fill="#B92237"/>
    <text x="180" y="676" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B92237">Subscriptions</text>
    <!-- Library tab -->
    <rect x="280" y="645" width="16" height="12" rx="2" fill="none" stroke="#6B3632" stroke-width="1.8"/>
    <line x1="284" y1="650" x2="292" y2="650" stroke="#6B3632" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="284" y1="653" x2="290" y2="653" stroke="#6B3632" stroke-width="1.6" stroke-linecap="round"/>
    <text x="288" y="676" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B3632">Library</text>
    <!-- Gesture pill -->
    <rect x="136" y="693" width="88" height="4" rx="2" fill="#61100C" fill-opacity="0.45"/>

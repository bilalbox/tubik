<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" role="img" aria-label="Tubik Subscriptions screen showing Allowed Channels only and the three-tab bottom bar without Trending">
  <defs>
    <clipPath id="screen-clip-1"><rect x="14" y="14" width="332" height="692" rx="28"/></clipPath>
  </defs>
  <rect x="6" y="6" width="348" height="708" rx="34" fill="#2A1412" stroke="#61100C" stroke-width="2"/>
  <g clip-path="url(#screen-clip-1)">
    <rect x="14" y="14" width="332" height="692" fill="#FFFDF8"/>
    <!-- Status bar -->
    <rect x="14" y="14" width="332" height="28" fill="#FFFDF8"/>
    <text x="32" y="33" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3D0B08">9:41</text>
    <circle cx="180" cy="28" r="5" fill="#2A1412"/>
    <rect x="306" y="23" width="18" height="9" rx="2" fill="none" stroke="#3D0B08" stroke-width="1.3"/>
    <rect x="308" y="25" width="12" height="5" rx="1" fill="#3D0B08"/>

    <!-- App bar -->
    <rect x="14" y="42" width="332" height="50" fill="#FFFDF8"/>
    <text x="30" y="73" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#3D0B08">Tubik</text>
    <!-- Search icon -->
    <circle cx="256" cy="67" r="6.5" fill="none" stroke="#3D0B08" stroke-width="1.8"/>
    <line x1="261" y1="72" x2="265" y2="76" stroke="#3D0B08" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Screen Pin icon -->
    <path d="M286,59 L294,59 L293,66 L296,69 L284,69 L287,66 Z M290,69 L290,76" fill="none" stroke="#B92237" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Overflow dots -->
    <circle cx="322" cy="61" r="1.5" fill="#3D0B08"/>
    <circle cx="322" cy="67" r="1.5" fill="#3D0B08"/>
    <circle cx="322" cy="73" r="1.5" fill="#3D0B08"/>

    <!-- Allowlist status strip -->
    <rect x="26" y="96" width="308" height="36" rx="10" fill="#FEE0AE" stroke="#E5BE7E" stroke-width="1"/>
    <path d="M44,106 L52,109 L52,115 C52,119.5 48.5,123 44,124.5 C39.5,123 36,119.5 36,115 L36,109 Z" fill="#B92237"/>
    <path d="M41,115 L43.2,117.2 L47.5,112.8" fill="none" stroke="#FFFDF8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="118" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3D0B08">Allowlist On · Allowed Channels Only</text>


    <text x="53" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">All (4)</text>
    <rect x="86" y="144" width="96" height="28" rx="14" fill="#F6EAD6"/>
    <text x="134" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#61100C">SciShow Kids</text>
    <rect x="188" y="144" width="76" height="28" rx="14" fill="#F6EAD6"/>
    <text x="226" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#61100C">PBS Eons</text>
    <rect x="270" y="144" width="64" height="28" rx="14" fill="#F6EAD6"/>
    <text x="302" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#61100C">Art Hub</text>

    <!-- Video card 1 -->
